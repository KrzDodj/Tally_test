<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Acceso Rápido - Tally</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
        }
        .container { 
            background: white; 
            width: 100%; 
            max-width: 500px; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h1 { text-align: center; color: #333; font-size: 24px; margin-bottom: 30px; }
        .group { margin-bottom: 25px; }
        .group-title { font-size: 14px; color: #888; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        button { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            background-color: #7957ff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        button:hover { background-color: #582eff; }
    </style>
</head>
<body>

<div class="container">
    <h1>Panel de Operaciones</h1>

    <div class="group">
        <div class="group-title">Activaciones</div>
        <button onclick="window.open('https://tally.so/r/wAYjbk?3d67f437-d55d-4f8b-8574-22435dde39a6=NO', '_blank')">
            🚀 Activar Bono (VES)
        </button>
    </div>

    <div class="group">
        <div class="group-title">Soporte</div>
        <button onclick="window.open('https://tally.so/r/wAYjbk', '_blank')">
            🔧 Soporte General
        </button>
    </div>
</div>

</body>
</html>
