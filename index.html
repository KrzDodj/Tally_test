<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Operaciones</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 20px; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 2px solid #7957ff; border-radius: 5px; font-size: 16px; margin-top: 5px; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; background-color: #7957ff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #582eff; }
        
        /* Estilo para la versión */
        .version {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
            color: #999;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Panel de Operaciones</h1>
    
    <div class="input-group">
        <label><strong>Nombre del Ejecutivo:</strong></label>
        <input type="text" id="ejecutivo" placeholder="Tu usuario...">
    </div>

    <button onclick="abrirFormulario('?3d67f437-d55d-4f8b-8574-22435dde39a6=NO&Razon=SOLICITUD&Categoria=BONOS')">
        🚀 Activar Bono (VES)
    </button>
    
    <button onclick="abrirFormulario('?Razon=SOPORTE')">
        🔧 Soporte General
    </button>
</div>

<!-- Etiqueta de versión -->
<div class="version">v1.1</div>

<script>
    function abrirFormulario(params) {
        const ejecValue = document.getElementById('ejecutivo').value;
        if (!ejecValue) {
            alert('Por favor, escribe tu nombre/ID de Ejecutivo primero.');
            return;
        }
        const baseUrl = 'https://tally.so/r/wAYjbk';
        // Usamos el prefijo 'f_' como acordamos
        const finalUrl = baseUrl + params + '&f_c74873e1-ef45-4cd4-a0a0-a7c6715967e1=' + encodeURIComponent(ejecValue);
        
        window.open(finalUrl, '_blank');
    }
</script>

</body>
</html>
